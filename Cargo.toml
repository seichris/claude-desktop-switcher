[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop",
]

[workspace.package]
version = "0.24.6-local.10"
edition = "2024"
license = "MIT"
repository = "https://github.com/matsumotory/claude-desktop-switcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
anyhow = "1"
thiserror = "2"
dirs = "7"
clap = { version = "4", features = ["derive"] }
colored = "3"

libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = "1.5"
sha2 = "0.10"
zstd = { version = "0.13.3", default-features = false }
